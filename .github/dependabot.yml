# Dependabot: weekly dependency updates for the backend, the frontend and CI.
#
# Every ecosystem uses a 14-day cooldown: a version is only proposed once it
# has been public for two weeks. Freshly published releases are where broken
# or malicious versions show up, so the delay is cheap supply-chain insurance.
#
# Updates are grouped by family so a week produces a few coherent pull
# requests instead of one per package. Each pull request runs the full CI,
# including the Sonar quality gate (SONAR_TOKEN must also be stored as a
# Dependabot secret, because Dependabot runs do not receive Actions secrets).
#
# The PostgreSQL image (compose.yaml and the Dev Services image) is not
# tracked on purpose: a major PostgreSQL upgrade requires migrating the data
# and must be a deliberate decision. The 17-alpine tag already picks up minor
# releases.

version: 2

updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, api]
    ignore:
      # Quarkus stays on its LTS line (currently 3.33): only patch releases
      # inside the line are proposed. Moving to the next LTS is a deliberate
      # upgrade with its own pull request, not an automatic minor bump.
      - dependency-name: "io.quarkus*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # google-java-format 1.37.x introduced an experimental formatter-style
      # API that Spotless 8.10 cannot call (NoSuchMethodError on
      # JavaFormatterOptions.Style.valueOf). It is a dead end: no 1.38 was
      # released and 2.0.0 stabilized the API. Spotless 8.11+ targets 2.0.0,
      # and both are in the quality-tools group, so they arrive together.
      - dependency-name: "com.google.googlejavaformat:google-java-format"
        versions: ["1.37.x"]
    groups:
      quarkus:
        patterns: ["io.quarkus*"]
      quality-tools:
        patterns:
          - "com.puppycrawl.tools:*"
          - "net.sourceforge.pmd:*"
          - "org.jacoco:*"
          - "com.diffplug.spotless*"
          - "com.google.googlejavaformat:*"
          - "com.tngtech.archunit:*"
      other:
        patterns: ["*"]

  - package-ecosystem: npm # pnpm is handled by the npm ecosystem
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    versioning-strategy: increase # keep the exact pins in package.json
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, web]
    ignore:
      # @types/node follows the Node.js major in web/.node-version (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next"]
      lint-format:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint", "prettier"]
      testing:
        patterns: ["vitest", "@vitest/*", "@vitejs/*", "jsdom", "@testing-library/*"]
      other:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
