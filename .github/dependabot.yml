version: 2

updates:
  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, api]
    ignore:
      - dependency-name: "io.quarkus*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.google.googlejavaformat:google-java-format"
        versions: ["1.37.x"]
    groups:
      quarkus:
        patterns: ["io.quarkus*"]
      quality-tools:
        patterns:
          - "com.puppycrawl.tools:*"
          - "net.sourceforge.pmd:*"
          - "org.jacoco:*"
          - "com.diffplug.spotless*"
          - "com.google.googlejavaformat:*"
          - "com.tngtech.archunit:*"
      other:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: build
      include: scope
    labels: [dependencies, web]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "eslint-config-next"]
      lint-format:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint", "prettier"]
      testing:
        patterns: ["vitest", "@vitest/*", "@vitejs/*", "jsdom", "@testing-library/*"]
      other:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
