# CI do Bouléplan
#
# Três jobs:
#   api   → lint (Checkstyle + PMD), testes contra Postgres real (Dev Services) e build
#   web   → formatação, lint, tipos, testes com cobertura e build de produção
#   sonar → junta os relatórios dos dois e roda o SonarQube Cloud; falha se o
#           quality gate reprovar
#
# As actions são fixadas pelo SHA do commit (com a versão no comentário):
# uma tag pode ser movida para outro código, o SHA não.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # check = Checkstyle + PMD + testes + relatório JaCoCo; build = empacota a aplicação.
      # Os testes sobem o Postgres via Testcontainers (Docker já vem no runner).
      - name: Lint, testes e build
        run: ./gradlew check build

      - name: Relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-reports
          path: |
            api/build/reports/tests/
            api/build/reports/checkstyle/
            api/build/reports/pmd/
          retention-days: 7

      - name: Publicar insumos do Sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-sonar-inputs
          path: |
            api/build/classes/
            api/build/reports/jacoco/
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web · formatação, lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A versão do pnpm vem do campo "packageManager" do web/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Testes com cobertura
        run: pnpm test:coverage

      - name: Build de produção
        run: pnpm build

      - name: Publicar insumos do Sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-sonar-inputs
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: Sonar · quality gate
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PRs vindos de forks não recebem o SONAR_TOKEN; nesses casos o job é pulado.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Histórico completo: o Sonar usa o blame do git para separar "código novo".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-sonar-inputs
          path: api/build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-sonar-inputs
          path: web/coverage

      # Configuração em sonar-project.properties. qualitygate.wait faz o job
      # esperar o resultado do gate e falhar se ele reprovar.
      - name: Análise e quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
