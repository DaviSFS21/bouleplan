# Bouléplan CI
#
# Three jobs:
#   api   → lint (Checkstyle + PMD), tests against a real PostgreSQL (Dev Services), build
#   web   → formatting, lint, types, tests with coverage, production build
#   sonar → merges both reports and runs SonarQube Cloud; fails if the quality
#           gate fails
#
# Actions are pinned to a commit SHA (version in the comment): a tag can be
# moved to different code, a SHA cannot.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # check = Checkstyle + PMD + tests + JaCoCo report; build = packages the app.
      # Tests start PostgreSQL through Testcontainers (the runner ships with Docker).
      - name: Lint, tests and build
        run: ./gradlew check build

      - name: Test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-test-reports
          path: |
            api/build/reports/tests/
            api/build/reports/checkstyle/
            api/build/reports/pmd/
          retention-days: 7

      - name: Upload Sonar inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-sonar-inputs
          path: |
            api/build/classes/
            api/build/reports/jacoco/
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web · format, lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from the "packageManager" field in web/package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests with coverage
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

      - name: Upload Sonar inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-sonar-inputs
          path: web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  sonar:
    name: Sonar · quality gate
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pull requests from forks do not get SONAR_TOKEN, so the job is skipped for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Full history: Sonar uses git blame to tell "new code" apart.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-sonar-inputs
          path: api/build

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-sonar-inputs
          path: web/coverage

      # Settings live in sonar-project.properties. qualitygate.wait makes the job
      # wait for the gate result and fail if the gate fails.
      - name: Analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
