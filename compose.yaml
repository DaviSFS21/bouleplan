# Bouléplan local development infrastructure.
# Usage: docker compose up -d   (from the repository root)
#
# The API in dev mode (./gradlew quarkusDev) connects to this database.
# Tests do NOT use it: they start their own throwaway PostgreSQL through
# Quarkus Dev Services (Testcontainers), so every run starts clean.
name: bouleplan

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bouleplan
      POSTGRES_USER: bouleplan
      POSTGRES_PASSWORD: bouleplan
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bouleplan -d bouleplan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
