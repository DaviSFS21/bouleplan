# Infraestrutura de desenvolvimento local do Bouléplan.
# Uso: docker compose up -d   (na raiz do repositório)
#
# A API em modo dev (./gradlew quarkusDev) se conecta a este banco.
# Os testes NÃO usam este banco: sobem um Postgres próprio e descartável
# via Quarkus Dev Services (Testcontainers), para cada execução começar limpa.
name: bouleplan

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bouleplan
      POSTGRES_USER: bouleplan
      POSTGRES_PASSWORD: bouleplan
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bouleplan -d bouleplan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
