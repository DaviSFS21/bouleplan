# Bouléplan local development infrastructure.
# Usage: cp .env.example .env   (once, then set your own values)
#        docker compose up -d   (from the repository root)
#
# Credentials come from the git-ignored .env file in the repository root,
# which Docker Compose loads automatically. Nothing secret lives here.
#
# The API in dev mode (./gradlew quarkusDev) connects to this database.
# Tests do NOT use it: they start their own throwaway PostgreSQL through
# Quarkus Dev Services (Testcontainers), so every run starts clean.
name: bouleplan

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      # Host port from .env (default 5432). Change DB_PORT when another
      # PostgreSQL already uses 5432 on your machine.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes Compose interpolation: the variables are read inside the container.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
