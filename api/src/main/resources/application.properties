quarkus.application.name=bouleplan-api

# Schema is owned by Flyway; Hibernate never changes the database.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.datasource.db-kind=postgresql

# Dev: Postgres from the repository root compose.yaml.
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/bouleplan
%dev.quarkus.datasource.username=bouleplan
%dev.quarkus.datasource.password=bouleplan

# Test: Dev Services (Testcontainers) with a pinned image.
%test.quarkus.datasource.devservices.image-name=postgres:17-alpine

# Prod: everything from environment variables, no defaults for secrets.
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

# Coverage: the quarkus-jacoco extension reuses the Gradle JaCoCo agent data
# (unit tests) and writes one merged report to build/jacoco-report/jacoco.xml.
# The data file (build/jacoco-quarkus.exec) and report location are the
# extension's Gradle defaults and match the agent path in build.gradle.kts.
%test.quarkus.jacoco.reuse-data-file=true
