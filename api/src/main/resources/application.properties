quarkus.application.name=bouleplan-api

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

quarkus.datasource.db-kind=postgresql

%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
%dev.quarkus.datasource.username=${DB_USERNAME}
%dev.quarkus.datasource.password=${DB_PASSWORD}

%test.quarkus.datasource.devservices.image-name=postgres:17-alpine

%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}

%test.quarkus.jacoco.reuse-data-file=true

bouleplan.local-user-id=00000000-0000-0000-0000-000000000001

quarkus.smallrye-openapi.store-schema-directory=build/openapi
# ASCII: the schema writer uses the platform charset.
quarkus.smallrye-openapi.info-title=Bouleplan API
quarkus.smallrye-openapi.info-version=1.0.0
# Server URLs would depend on the build host.
quarkus.smallrye-openapi.auto-add-server=false
