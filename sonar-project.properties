# Análise do SonarQube Cloud — um projeto só para o monorepo (api + web),
# com um único quality gate cobrindo backend e frontend.
#
# Os relatórios (classes compiladas, JaCoCo, lcov) são gerados pelos jobs
# "api" e "web" do CI e baixados pelo job "sonar" antes do scan.

sonar.organization=davisfs21
sonar.projectKey=DaviSFS21_bouleplan
sonar.projectName=Bouléplan
sonar.sourceEncoding=UTF-8

# Código de produção e de teste.
# Em web/, os testes ficam ao lado do código (*.test.ts[x]), por isso as
# inclusões/exclusões separam os dois dentro da mesma pasta.
sonar.sources=api/src/main,web/src
sonar.tests=api/src/test,web/src
sonar.exclusions=web/src/**/*.test.ts,web/src/**/*.test.tsx
sonar.test.inclusions=web/src/**/*.test.ts,web/src/**/*.test.tsx

# Java
sonar.java.source=21
sonar.java.binaries=api/build/classes/java/main
sonar.java.test.binaries=api/build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=api/build/reports/jacoco/test/jacocoTestReport.xml

# TypeScript (os caminhos no lcov são relativos à raiz do repositório)
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
